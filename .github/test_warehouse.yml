
name: Test HeatSafe DuckDB Warehouse

on:
  workflow_dispatch:

jobs:
  test-warehouse:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install pandas numpy duckdb

      - name: Build cleaned and processed data
        run: python src/data_pipeline.py

      - name: Build DuckDB warehouse
        run: python src/build_warehouse.py

      - name: Save database artifact
        uses: actions/upload-artifact@v4
        with:
          name: heatsafe-duckdb-warehouse
          path: data/heatsafe.duckdb
          if-no-files-found: error
