
name: Test HeatSafe Live Weather

on:
  workflow_dispatch:

jobs:
  test-live-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required libraries
        run: |
          python -m pip install --upgrade pip
          pip install prefect requests

      - name: Run Prefect live-weather flow
        run: python flows/live_weather_flow.py

      - name: Save weather output
        uses: actions/upload-artifact@v4
        with:
          name: heatsafe-live-weather
          path: outputs/latest_weather.json
