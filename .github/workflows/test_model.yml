
name: Test HeatSafe ML Model

on:
  workflow_dispatch:

jobs:
  test-model:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Build cleaned and processed data
        run: python src/data_pipeline.py

      - name: Train and test model
        run: python src/train_model.py

      - name: Save trained ML model
        uses: actions/upload-artifact@v4
        with:
          name: heatsafe-trained-model
          path: models/heatsafe_live_improved_model.pkl
          if-no-files-found: error
