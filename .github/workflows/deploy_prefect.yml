
name: Deploy HeatSafe to Prefect Serverless

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deployment libraries
        run: |
          python -m pip install --upgrade pip
          pip install "prefect>=3,<4"

      - name: Create Prefect deployment
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
        run: |
          python -m prefect deploy \
            --prefect-file prefect.yaml \
            --name heatsafe-hourly-live
