
name: heatsafe-pakistan
prefect-version: "3"

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/SarisaParvez456/HeatSafe-Pakistan.git
      branch: main

deployments:
  - name: heatsafe-hourly-live
    entrypoint: flows/live_weather_flow.py:live_weather_flow
    work_pool:
      name: heatsafe-hourly-pool
      job_variables:
        pip_packages:
          - "prefect>=3,<4"
          - requests
          - pandas
          - scikit-learn
          - joblib
    schedules:
      - cron: "22 * * * *"
        timezone: Asia/Karachi
        active: true
