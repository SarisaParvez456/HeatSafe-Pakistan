
name: Test Make Data

on:
  workflow_dispatch:

jobs:
  test-make-data:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required libraries
        run: pip install pandas numpy duckdb

      - name: Run make data
        run: make data
