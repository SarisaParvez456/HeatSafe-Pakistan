
name: Test Make Data

on:
  workflow_dispatch:

jobs:
  test-make-data:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required libraries
        run: pip install pandas numpy duckdb "pandera[pandas]"

      - name: Save data quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: heatsafe-data-quality
          path: outputs/data_quality/
          if-no-files-found: error
        
      - name: Generate manifest
        run: python src/create_manifest.py

      - name: Save manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: heatsafe-manifest
          path: manifest.csv
          if-no-files-found: error
